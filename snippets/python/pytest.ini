[pytest]
# Varios módulos tienen archivos con el mismo nombre (test_qa_case.py): importlib evita choques.
addopts = --import-mode=importlib --browser chromium
pythonpath = . page-object-model
testpaths = .
norecursedirs = .venv
# Etiquetas propias (módulo Ejecutar pruebas): registradas para que pytest no las marque como desconocidas.
markers =
    smoke: pruebas rápidas de lo esencial
